name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: Static site — drift check and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generated output matches src/
        run: node build.mjs --check
      - name: Serverless function tests (no network)
        run: node --test 'tests/*.test.mjs'
